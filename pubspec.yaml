name: smart_exam_pro
description: A production-ready Android application for teachers to manage exams.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.6.0

  # Notifications
  flutter_local_notifications: ^16.0.0

  # Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Local Storage
  hive_flutter: ^1.1.0

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  permission_handler: ^11.4.0
  wakelock_plus: ^1.1.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0

flutter:
  uses-material-design: true
