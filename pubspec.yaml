name: klasivo
description: Klasivo — A production-ready Android exam management application for teachers and students.
publish_to: 'none'

version: 2.0.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.4.0
  firebase_messaging: ^15.2.0
  firebase_crashlytics: ^4.3.0
  firebase_performance: ^0.10.0
  firebase_app_check: ^0.3.2
  firebase_analytics: ^11.6.0
  sentry_flutter: ^9.0.0

  # LiveKit (Video Classes)
  livekit_client: ^2.3.0

  # Deep Links
  app_links: ^6.3.2

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Notifications
  flutter_local_notifications: ^17.2.0

  # Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Local Storage
  hive_flutter: ^1.1.0

  # Security - Password Hashing
  crypto: ^3.0.3

  # Excel Import
  excel: ^4.0.6
  file_picker: ^8.0.0
  path_provider: ^2.1.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # PDF Reports
  pdf: ^3.10.8
  printing: ^5.12.0

  # Charts / Analytics
  fl_chart: ^0.68.0

  # HTTP (for Arabic font download)
  http: ^1.2.0

  # URL Launcher (for LMS links)
  url_launcher: ^6.2.0

  # Video Player (YouTube integration)
  youtube_player_flutter: ^9.0.3

  # Utilities
  equatable: ^2.0.5
  intl: ^0.20.0
  timeago: ^3.6.2
  permission_handler: ^11.4.0
  wakelock_plus: ^1.1.0
  timezone: ^0.9.2
  share_plus: ^12.0.2
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^3.1.0
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A3A8A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
