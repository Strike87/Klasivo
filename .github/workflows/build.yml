name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      environment:
        description: 'Firebase environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.x'

jobs:
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug \
          --dart-define=environment=${{ github.event.inputs.environment || 'dev' }}

      - name: Rename APK
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          mv build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/klasivo-debug-v${VERSION}.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: klasivo-debug-apk
          path: build/app/outputs/flutter-apk/klasivo-debug-*.apk
          retention-days: 30

  build-release:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release \
          --dart-define=environment=${{ github.event.inputs.environment || 'prod' }} \
          --obfuscate --split-debug-info=build/debug-info

      - name: Rename APK
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/klasivo-release-v${VERSION}.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: klasivo-release-apk
          path: build/app/outputs/flutter-apk/klasivo-release-*.apk
          retention-days: 90

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: klasivo-debug-symbols
          path: build/debug-info/
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/klasivo-release-*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-app-bundle:
    name: App Bundle (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release \
          --dart-define=environment=prod \
          --obfuscate --split-debug-info=build/debug-info

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: klasivo-app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
