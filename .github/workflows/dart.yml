# Legacy Dart workflow — replaced by test.yml, build.yml, and pr-checks.yml
# This file is kept for reference. The new workflows provide:
# - Flutter-specific test execution (test.yml)
# - APK build pipeline (build.yml)
# - PR quick checks (pr-checks.yml)
name: Dart (Legacy)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
